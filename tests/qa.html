<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Verificação local</title><style>body{background:#333;color:#fff;font:14px Arial;margin:15px}button{padding:10px;margin:5px}iframe{border:0;display:block;margin:12px auto;background:#0b1316;height:850px;width:390px}</style><div><button onclick="size(320)">320px</button><button onclick="size(390)">390px</button><button onclick="size(1280)">Desktop</button><button onclick="load('start')">Início</button><button onclick="load('active')">Clube de teste</button><button onclick="load('bad')">Temporada ruim</button><button onclick="load('medium')">Temporada mediana</button><button onclick="load('champion')">Campeão</button><button onclick="load('final')">Carreira completa</button></div><iframe id="game" title="Jogo em teste" src="../index.html"></iframe><script src="../js/weekly.js"></script><script src="../js/data.js"></script><script src="../js/engine.js"></script><script src="../js/seasons.js"></script><script>
function size(n){document.querySelector('iframe').style.width=n+'px';}
const controls=document.createElement('div');
controls.innerHTML='<button data-pack="base">Pacote Base</button><button data-pack="silver">Pacote Prata</button><button data-pack="gold">Pacote Ouro</button><button data-pack="choice">A Escolha</button><button data-pack="totw">Time da Semana</button><button data-pack="shop">Loja com moedas</button>';
document.querySelector('iframe').before(controls);
controls.addEventListener('click',event=>{const id=event.target.dataset.pack;if(!id)return;const D=OuroData,E=OuroEngine;let s;
for(let seed=1;seed<100;seed++){s=E.createClub({name:'Craques da Resenha',short:'CDR',captain:D.captains[0],slot:'bot',color:'#bcf269'},seed);E.openPack(s,'welcome');E.finishPack(s);s.coins=100000;
if(id!=='shop')E.openPack(s,id);if(id!=='totw'||D.byId[s.pendingPack.cards[0].id].name==='Gabigol')break;}
localStorage.setItem('onze-de-ouro-save-v1',JSON.stringify(s));localStorage.setItem('onze-de-ouro-prefs-v1',JSON.stringify({quick:false,sound:false}));document.querySelector('iframe').src='../index.html';});
function load(mode){if(mode==='start'){localStorage.removeItem('onze-de-ouro-save-v1');document.querySelector('iframe').src='../index.html';return;}const D=OuroData,E=OuroEngine,seed=mode==='bad'?1:mode==='medium'?4:2,s=E.createClub({name:'Resenha FC',short:'RFC',captain:D.captains[0],slot:'bot',color:'#bcf269'},seed);E.openPack(s,'welcome');E.finishPack(s);if(['medium','champion','final'].includes(mode)){s.squad=D.players.filter(p=>mode==='medium'?p.ovr>=73&&p.ovr<=75:p.ovr>=85).map(p=>p.id);}E.optimize(s);const years=mode==='final'?5:1;for(let y=1;y<=years;y++){const rounds=mode==='active'?2:19;for(let i=0;i<rounds;i++)E.advanceRound(s);if(y<years){const e=E.pendingEvent(s);E.resolveSeasonEvent(s,e.kind==='choice'?e.targets.at(-1):e.kind==='dilemma'?'coins':undefined);E.nextSeason(s);}}localStorage.setItem('onze-de-ouro-save-v1',JSON.stringify(s));localStorage.setItem('onze-de-ouro-prefs-v1',JSON.stringify({quick:true,sound:false}));document.querySelector('iframe').src='../index.html';}
</script></html>
